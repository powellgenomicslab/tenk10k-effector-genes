# params to adjust in scDRS run
gs_src_species: "human"
gs_dst_species: "human"
h5ad_species: "human"
raw_count: False
filter_data: False
n_ctrl: 1000
adj_prop_col: wg2_scpred_prediction
sample_by_col: wg2_scpred_prediction
group_stats_col: wg2_scpred_prediction
max_cells_per_cell_type: 10000
sample_fraction: 0.1
return_ctrl_raw_score: False
return_ctrl_norm_score: True

# preprocessing params
pp_n_mean_bin: 20
pp_n_var_bin: 20

# columns for various downstream analysis
regress_out_cols:
  - n_counts
  - pct_counts_mt

harmony_batch_col: sequencing_library